<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Қатаған</title>
  <script>
    try {
      var mode = localStorage.getItem("katagun-theme");
      if (mode === "light" || mode === "dark") document.documentElement.setAttribute("data-theme", mode);
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,460;0,8..60,600;1,8..60,460&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --desk: #14110e;
      --desk-glow: #2c261e;
      --paper: #f4ecdc;
      --ink: #1c2744;
      --faded: #5e564c;
      --seal: #8d2f2c;
      --rule: rgba(28, 39, 68, 0.2);
      --hit: #f0cfc8;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --desk: #0e0c0a;
      --desk-glow: #3a2a24;
      --paper: #221e1a;
      --ink: #f4ecdc;
      --faded: #b7ab9c;
      --seal: #e08a82;
      --rule: rgba(244, 236, 220, 0.2);
      --hit: #5c2e2c;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --desk: #0e0c0a;
        --desk-glow: #3a2a24;
        --paper: #221e1a;
        --ink: #f4ecdc;
        --faded: #b7ab9c;
        --seal: #e08a82;
        --rule: rgba(244, 236, 220, 0.2);
        --hit: #5c2e2c;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Source Serif 4", "Noto Serif", Palatino, serif;
      background:
        radial-gradient(900px 480px at 70% -10%, var(--desk-glow) 0%, transparent 60%),
        var(--desk);
    }

    .page {
      width: min(1440px, calc(100% - 40px));
      margin: 28px auto 48px;
      padding: 36px 36px 28px;
      background: var(--paper);
      box-shadow:
        0 0 0 1px rgba(255, 248, 235, 0.25),
        0 28px 70px rgba(0, 0, 0, 0.38);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--rule);
    }

    .masthead {
      display: grid;
      grid-template-columns: auto auto;
      column-gap: 0.16em;
      justify-content: start;
      align-items: center;
      padding-left: 14px;
      border-left: 3px solid var(--seal);
      font-size: clamp(42px, 6vw, 68px);
    }

    h1 {
      grid-column: 2;
      grid-row: 1;
      margin: 0;
      font-size: 1em;
      font-weight: 600;
      line-height: 0.88;
      letter-spacing: -0.03em;
    }

    .tamga {
      grid-column: 1;
      grid-row: 1;
      width: 0.92em;
      height: 1.05em;
    }

    .tamga path {
      fill: none;
      stroke: currentColor;
      stroke-width: 4.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .eleven {
      grid-column: 2;
      grid-row: 2;
      margin: 10px 0 0;
      color: var(--seal);
      font-style: italic;
      font-size: 22px;
    }

    .legend {
      margin: 16px 0 0;
      border-collapse: collapse;
      color: var(--ink);
      font-size: 14px;
      line-height: 1.35;
    }

    .legend td {
      padding: 3px 0;
      vertical-align: middle;
    }

    .legend td:first-child {
      width: 40px;
      padding-right: 12px;
    }

    .legend .key {
      display: block;
      width: 32px;
      height: 8px;
    }

    .legend .key line {
      stroke: var(--ink);
      stroke-width: 1.5;
    }

    .legend .key.dotted line {
      stroke-dasharray: 2 3;
    }

    .langs {
      display: flex;
      gap: 2px;
      margin: 0;
      padding: 0;
    }

    .langs button {
      font: inherit;
      font-size: 13px;
      letter-spacing: 0.16em;
      color: var(--faded);
      background: none;
      border: 0;
      padding: 8px 10px;
      cursor: pointer;
    }

    .langs button[aria-pressed="true"] {
      color: var(--ink);
      box-shadow: inset 0 -2px 0 var(--seal);
    }

    .langs button:focus-visible,
    .themes button:focus-visible,
    .github:focus-visible {
      outline: 2px solid var(--seal);
      outline-offset: 2px;
    }

    .themes {
      display: flex;
      gap: 2px;
    }

    .themes button,
    .github {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      padding: 0;
      color: var(--faded);
      background: none;
      border: 0;
      cursor: pointer;
      text-decoration: none;
    }

    .themes button:hover,
    .github:hover,
    .themes button[aria-pressed="true"] {
      color: var(--ink);
    }

    .themes button[aria-pressed="true"] {
      box-shadow: inset 0 -2px 0 var(--seal);
    }

    .themes svg,
    .github svg {
      width: 16px;
      height: 16px;
      display: block;
    }

    .themes svg {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .github svg {
      fill: currentColor;
    }

    .header-tools {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .search {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .search input {
      width: 168px;
      padding: 6px 0;
      color: var(--ink);
      font: inherit;
      font-size: 15px;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--rule);
      border-radius: 0;
    }

    .search input::placeholder {
      color: var(--faded);
      font-style: italic;
    }

    .search input:focus {
      outline: none;
      border-bottom-color: var(--seal);
    }

    .search input.is-miss {
      border-bottom-color: var(--seal);
    }

    .search-count {
      min-width: 2.4em;
      color: var(--faded);
      font-size: 13px;
    }

    #diagram .node .label-container {
      stroke-width: 1px !important;
    }

    #diagram .node.is-hit .label-container {
      stroke: var(--seal) !important;
      stroke-width: 3.5px !important;
      fill: var(--hit) !important;
    }

    .canvas {
      position: relative;
      margin-top: 16px;
    }

    .tools {
      position: absolute;
      z-index: 2;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 2px;
      padding: 4px;
      background: color-mix(in srgb, var(--paper) 88%, var(--ink));
      border: 1px solid var(--rule);
    }

    .tools button {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      padding: 0;
      color: var(--ink);
      background: transparent;
      border: 0;
      cursor: pointer;
    }

    .tools button[data-action="reset"] {
      width: auto;
      padding: 0 8px;
      font: inherit;
      font-size: 12px;
      letter-spacing: 0.06em;
    }

    .tools button:hover {
      color: var(--seal);
    }

    .tools button:disabled {
      color: var(--faded);
      opacity: 0.4;
      cursor: default;
    }

    .tools button:focus-visible {
      outline: 2px solid var(--seal);
      outline-offset: -2px;
    }

    .tools svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }

    .diagram {
      overflow: auto;
      max-height: 78vh;
      padding-bottom: 8px;
    }

    .stage {
      width: max-content;
    }

    .diagram svg {
      display: block;
      max-width: none;
      height: auto;
    }

    .diagram.is-swapping { opacity: 0; }

    @media (prefers-reduced-motion: no-preference) {
      .diagram { transition: opacity 160ms ease; }
    }

    .canvas:fullscreen,
    .canvas.is-overlay {
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 20px;
      background: var(--paper);
      overflow: hidden;
    }

    .canvas:fullscreen .diagram,
    .canvas.is-overlay .diagram {
      flex: 1;
      max-height: none;
    }

    .canvas.is-overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
    }

    .minimap {
      position: absolute;
      z-index: 2;
      right: 14px;
      bottom: 14px;
      width: 176px;
      background: var(--paper);
      border: 1px solid var(--rule);
      overflow: hidden;
      cursor: pointer;
      touch-action: none;
    }

    .minimap svg {
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .minimap-view {
      position: absolute;
      box-sizing: border-box;
      border: 1.5px solid var(--seal);
      background: rgba(141, 47, 44, 0.16);
      pointer-events: none;
    }

    .error {
      margin: 16px 0 0;
      color: var(--seal);
      font-size: 14px;
      white-space: pre-wrap;
    }

    @media (max-width: 640px) {
      .page {
        width: auto;
        margin: 12px;
        padding: 22px 16px 18px;
      }

      header {
        flex-direction: column;
        align-items: flex-start;
      }

      .header-tools {
        width: 100%;
        justify-content: space-between;
      }

      .search input {
        width: min(168px, 46vw);
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div>
        <div class="masthead">
          <svg class="tamga" id="tamga" role="img" aria-label="Тамға" viewBox="0 0 80 96">
            <title>Тамға</title>
            <path d="M40 4V70"/>
            <path d="M8 42A32 32 0 0 0 72 42"/>
          </svg>
          <h1 id="name">Қатаған</h1>
          <p class="eleven" id="eleven">Шежіре</p>
        </div>
      </div>
      <div class="header-tools">
        <form class="search" id="search-form" role="search">
          <input id="search" type="search" placeholder="Іздеу" autocomplete="off" spellcheck="false" aria-label="Іздеу">

        </form>
        <div class="langs" role="group" aria-label="Language">

        </div>
        <div class="themes" role="group" id="themes" aria-label="Theme">

            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="12"/><path d="M8 20h8M12 16v4"/></svg>
          </button>
          <button type="button" data-theme="light" aria-pressed="false" aria-label="Light" title="Light">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.8 5.8l1.8 1.8M16.4 16.4l1.8 1.8M18.2 5.8l-1.8 1.8M7.6 16.4l-1.8 1.8"/></svg>
          </button>
          <button type="button" data-theme="dark" aria-pressed="false" aria-label="Dark" title="Dark">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A7.5 7.5 0 0 1 9.5 4 7.2 7.2 0 1 0 20 14.5z"/></svg>

        <a class="github" href="https://github.com/katagun/katagun" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        </a>
      </div>
    </header>
    <table class="legend" id="legend" aria-label="Түсініктеме">
      <tbody>
        <tr>
          <td><svg class="key" viewBox="0 0 32 8" aria-hidden="true"><line x1="0" y1="4" x2="32" y2="4"/></svg></td>
          <td id="legend-solid">Тұтас сызық: әкеден балаға</td>
        </tr>
        <tr>
          <td><svg class="key dotted" viewBox="0 0 32 8" aria-hidden="true"><line x1="0" y1="4" x2="32" y2="4"/></svg></td>
          <td id="legend-dotted">Үзік сызық: ру атауынан белгілі ең көне аталарға</td>
        </tr>
        <tr>
          <td></td>
          <td id="legend-names">Латынша Qataghan, сондай-ақ Katagan және Katagun.</td>
        </tr>
      </tbody>
    </table>
    <div class="canvas" id="canvas">
      <div class="tools" role="toolbar" id="tools" aria-label="Diagram">
        <button type="button" data-action="out" aria-label="Кішірейту">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
        </button>
        <button type="button" data-action="reset" aria-label="100%">100%</button>
        <button type="button" data-action="in" aria-label="Үлкейту">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button type="button" data-action="fullscreen" aria-pressed="false" aria-label="Толық экран">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path id="fullscreen-icon" d="M4 8V4h4M20 8V4h-4M4 16v4h4M20 16v4h-4"/></svg>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.min.js" integrity="sha384-EOXBFmc3gx5mb+vn0vPvvGqACToJD24hhacX5Yx+8NUUQrHIle/Qi5Bg9o3zKwW2" crossorigin="anonymous"></script>
  <script src="tree.js?v=24"></script>
  <script>
    const SUBTITLE = { en: "Genealogy", kz: "Шежіре", ru: "Родословная" };
    const LEGEND = {
      en: {
        label: "Legend",
        solid: "Solid line: father to son",
        dotted: "Dotted line: from the tribe to the oldest known ancestors",
        names: "Qataghan is also transliterated as Katagan and Katagun.",
      },
      kz: {
        label: "Түсініктеме",
        solid: "Тұтас сызық: әкеден балаға",
        dotted: "Үзік сызық: ру атауынан белгілі ең көне аталарға",
        names: "Латынша Qataghan, сондай-ақ Katagan және Katagun.",
      },
      ru: {
        label: "Легенда",
        solid: "Сплошная линия: от отца к сыну",
        dotted: "Пунктир: от названия рода к древнейшим известным предкам",
        names: "Латиницей Qataghan, также Katagan и Katagun.",
      },
    };
    const TAMGA = { en: "Tamga", kz: "Тамға", ru: "Тамга" };
    const HTML_LANG = { en: "en", kz: "kk", ru: "ru" };

    function cssColor(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    function configureMermaid() {
      const ink = cssColor("--ink");
      const paper = cssColor("--paper");
      mermaid.initialize({
        startOnLoad: false,
        securityLevel: "strict",
        theme: "base",
        themeVariables: {
          background: "transparent",
          primaryColor: paper,
          primaryTextColor: ink,
          primaryBorderColor: ink,
          lineColor: ink,
          fontFamily: '"Source Serif 4", "Noto Serif", Palatino, serif',
          fontSize: "15px",
        },
        flowchart: {
          curve: "stepBefore",
          ranker: "tight-tree",
          nodeSpacing: 40,
          rankSpacing: 56,
          htmlLabels: true,
          padding: 12,
        },
      });
    }

    const TOOLS = {
      en: { out: "Zoom out", reset: "Reset to 100%", in: "Zoom in", fullscreen: "Full screen", exit: "Exit full screen", toolbar: "Diagram", map: "Overview", search: "Search", none: "No match", themes: "Theme", system: "System", light: "Light", dark: "Dark", github: "GitHub" },
      kz: { out: "Кішірейту", reset: "100% қалпына келтіру", in: "Үлкейту", fullscreen: "Толық экран", exit: "Толық экраннан шығу", toolbar: "Схема", map: "Шолу", search: "Іздеу", none: "Жоқ", themes: "Тақырып", system: "Жүйе", light: "Жарық", dark: "Қараңғы", github: "GitHub" },
      ru: { out: "Уменьшить", reset: "Сбросить до 100%", in: "Увеличить", fullscreen: "На весь экран", exit: "Выйти из полного экрана", toolbar: "Схема", map: "Обзор", search: "Поиск", none: "Нет", themes: "Тема", system: "Система", light: "Светлая", dark: "Тёмная", github: "GitHub" },
    };
    const FULLSCREEN_ICON = {
      enter: "M4 8V4h4M20 8V4h-4M4 16v4h4M20 16v4h-4",
      exit: "M8 4v4H4M16 4v4h4M20 16h-4v4M4 16h4v4",
    };
    const MIN_SCALE = 0.5;
    const MAX_SCALE = 2.5;
    let scale = 1;

    const diagram = document.getElementById("diagram");
    const stage = document.getElementById("stage");
    const canvas = document.getElementById("canvas");
    const error = document.getElementById("error");
    let renderSeq = 0;

    function toolButton(action) {
      return document.querySelector(`.tools [data-action="${action}"]`);
    }

    function updateToolLabels(lang) {
      const labels = TOOLS[lang];
      document.getElementById("tools").setAttribute("aria-label", labels.toolbar);
      for (const action of ["out", "reset", "in"]) {
        const button = toolButton(action);
        button.setAttribute("aria-label", labels[action]);
        button.title = labels[action];
      }
      const full = toolButton("fullscreen");
      const expanded = Boolean(document.fullscreenElement) || canvas.classList.contains("is-overlay");
      const label = expanded ? labels.exit : labels.fullscreen;
      full.setAttribute("aria-label", label);
      full.title = label;
      full.setAttribute("aria-pressed", String(expanded));
      document.getElementById("fullscreen-icon").setAttribute("d", expanded ? FULLSCREEN_ICON.exit : FULLSCREEN_ICON.enter);
      document.getElementById("minimap").setAttribute("aria-label", labels.map);
      document.getElementById("minimap").title = labels.map;
      const search = document.getElementById("search");
      search.placeholder = labels.search;
      search.setAttribute("aria-label", labels.search);
      if (search.classList.contains("is-miss")) document.getElementById("search-count").textContent = labels.none;
      document.getElementById("themes").setAttribute("aria-label", labels.themes);
      for (const mode of ["system", "light", "dark"]) {
        const button = document.querySelector(`.themes [data-theme="${mode}"]`);
        button.setAttribute("aria-label", labels[mode]);
        button.title = labels[mode];
        button.setAttribute("aria-pressed", String(mode === themeMode()));
      }
      document.querySelector(".github").setAttribute("aria-label", labels.github);
    }

    function themeMode() {
      try {
        const saved = localStorage.getItem("katagun-theme");
        if (saved === "light" || saved === "dark" || saved === "system") return saved;
      } catch (e) {}
      return "system";
    }

    function applyTheme(mode) {
      try {
        localStorage.setItem("katagun-theme", mode);
      } catch (e) {}
      if (mode === "light" || mode === "dark") document.documentElement.setAttribute("data-theme", mode);
      else document.documentElement.removeAttribute("data-theme");
    }

    const PEOPLE = Object.keys(SOURCE.nodes).map((id) => ({
      id,
      labels: ["kz", "en", "ru"].map((code) => transliterate(SOURCE.nodes[id], code)),
    }));
    let hits = [];
    let hitIndex = 0;

    function norm(text) {
      return text
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/қ/g, "к")
        .replace(/ғ/g, "г")
        .replace(/ң/g, "н")
        .replace(/ә/g, "а")
        .replace(/ө/g, "о")
        .replace(/ұ/g, "у")
        .replace(/ү/g, "у")
        .replace(/і/g, "и")
        .replace(/ё/g, "е")
        .replace(/й/g, "и")
        .replace(/q/g, "k")
        .replace(/gh/g, "g")
        .replace(/kh/g, "h")
        .replace(/[^a-zа-я0-9]+/gi, "");
    }

    function matchPeople(query) {
      const folded = norm(query);
      if (!folded) return [];
      const ranked = [];
      for (const person of PEOPLE) {
        let best = 0;
        for (const label of person.labels) {
          const name = norm(label);
          let score = 0;
          if (name === folded) score = 3;
          else if (name.startsWith(folded)) score = 2;
          else if (name.includes(folded)) score = 1;
          if (score > best) best = score;
        }
        if (best) ranked.push({ id: person.id, score: best, len: norm(person.labels[0]).length });
      }
      ranked.sort((a, b) => b.score - a.score || a.len - b.len || a.id.localeCompare(b.id));
      return ranked;
    }

    function drawnNode(id) {
      return [...stage.querySelectorAll(".node")].find((node) => node.id.includes("flowchart-" + id + "-"));
    }

    function pageLang() {
      if (document.documentElement.lang === "en") return "en";
      if (document.documentElement.lang === "ru") return "ru";
      return "kz";
    }

    function centerOnDrawn(node) {
      const diagramRect = diagram.getBoundingClientRect();
      const rect = node.getBoundingClientRect();
      diagram.scrollLeft += rect.left - diagramRect.left + rect.width / 2 - diagram.clientWidth / 2;
      diagram.scrollTop += rect.top - diagramRect.top + rect.height / 2 - diagram.clientHeight / 2;
    }

    function paintSearch() {
      const input = document.getElementById("search");
      const count = document.getElementById("search-count");
      const query = input.value.trim();
      for (const node of stage.querySelectorAll(".node.is-hit")) node.classList.remove("is-hit");
      input.classList.toggle("is-miss", Boolean(query) && hits.length === 0);
      if (!query || !hits.length) {
        count.textContent = query ? TOOLS[pageLang()].none : "";
        return null;
      }
      const node = drawnNode(hits[hitIndex].id);
      if (node) node.classList.add("is-hit");
      count.textContent = hits.length > 1 ? `${hitIndex + 1}/${hits.length}` : "";
      return node;
    }

    function applySearch(recenter) {
      hits = matchPeople(document.getElementById("search").value.trim());
      if (hitIndex >= hits.length) hitIndex = 0;
      const node = paintSearch();
      if (recenter && node) centerOnDrawn(node);
      if (stage.querySelector("svg")) mountMinimap();
    }

    function nodeBox(node) {
      const shape = node.querySelector("rect, circle, polygon");
      if (!shape) return null;
      const shift = /translate\(\s*([-\d.]+)[,\s]+([-\d.]+)\s*\)/.exec(node.getAttribute("transform") || "");
      const tx = shift ? Number(shift[1]) : 0;
      const ty = shift ? Number(shift[2]) : 0;
      const box = shape.getBBox();
      return {
        cx: tx + box.x + box.width / 2,
        top: ty + box.y,
        bottom: ty + box.y + box.height,
      };
    }

    function joinStems(svg) {
      const boxes = new Map();
      for (const node of svg.querySelectorAll(".node")) {
        const match = /flowchart-(.+)-\d+$/.exec(node.id);
        const box = match && nodeBox(node);
        if (box) boxes.set(match[1], box);
      }
      const ids = [...boxes.keys()].sort((a, b) => b.length - a.length);
      const groups = new Map();
      for (const path of svg.querySelectorAll(".edgePaths path.flowchart-link")) {
        const dataId = path.dataset.id || "";
        let from = "";
        let to = "";
        for (const id of ids) {
          const prefix = "L_" + id + "_";
          if (!dataId.startsWith(prefix)) continue;
          const rest = dataId.slice(prefix.length).replace(/_\d+$/, "");
          if (!boxes.has(rest)) continue;
          from = id;
          to = rest;
          break;
        }
        if (!from) continue;
        if (!groups.has(from)) groups.set(from, []);
        groups.get(from).push({ path, to });
      }

      const n = (value) => Math.round(value * 100) / 100;
      for (const [from, links] of groups) {
        const parent = boxes.get(from);
        const children = links.map((link) => boxes.get(link.to));
        const top = Math.min(...children.map((child) => child.top));
        const branchY = parent.bottom + (top - parent.bottom) / 2;
        const xs = children.map((child) => child.cx);
        const singleAndCentered = children.length === 1 && Math.abs(xs[0] - parent.cx) < 6;
        const parts = [];
        if (singleAndCentered) {
          parts.push(`M${n(parent.cx)},${n(parent.bottom)}L${n(xs[0])},${n(children[0].top)}`);
        } else {
          parts.push(`M${n(parent.cx)},${n(parent.bottom)}L${n(parent.cx)},${n(branchY)}`);
          const barLeft = Math.min(parent.cx, ...xs);
          const barRight = Math.max(parent.cx, ...xs);
          if (barRight - barLeft > 0.5) parts.push(`M${n(barLeft)},${n(branchY)}L${n(barRight)},${n(branchY)}`);
          for (const child of children) {
            if (child.top - branchY > 0.5) parts.push(`M${n(child.cx)},${n(branchY)}L${n(child.cx)},${n(child.top)}`);
          }
        }
        links[0].path.setAttribute("d", parts.join(""));
        links[0].path.style.fill = "none";
        const dotted = links.every((link) => link.path.classList.contains("edge-pattern-dotted"));
        if (dotted) links[0].path.style.strokeDasharray = "2 3";
        for (const link of links.slice(1)) link.path.style.display = "none";
      }
    }

    function mountMinimap() {
      const svg = stage.querySelector("svg");
      const frame = document.getElementById("minimap");
      const content = document.getElementById("minimap-content");
      if (!svg) return;
      const clone = svg.cloneNode(true);
      clone.removeAttribute("id");
      clone.setAttribute("width", "100%");
      clone.setAttribute("height", "100%");
      clone.setAttribute("preserveAspectRatio", "xMidYMid meet");
      clone.querySelectorAll("[id]").forEach((el) => el.removeAttribute("id"));
      clone.querySelectorAll(".label, .edgeLabel, foreignObject").forEach((el) => el.remove());
      const box = svg.viewBox.baseVal;
      frame.style.height = `${Math.round(176 * box.height / box.width)}px`;
      content.replaceChildren(clone);
      updateMinimap();
    }

    function updateMinimap() {
      const frame = document.getElementById("minimap");
      const view = document.getElementById("minimap-view");
      const contentW = stage.offsetWidth;
      const contentH = stage.offsetHeight;
      if (!frame || !contentW || !contentH) return;
      const mapW = frame.clientWidth;
      const mapH = frame.clientHeight;
      const width = Math.min(mapW, diagram.clientWidth / contentW * mapW);
      const height = Math.min(mapH, diagram.clientHeight / contentH * mapH);
      const left = Math.min(mapW - width, Math.max(0, diagram.scrollLeft / contentW * mapW));
      const top = Math.min(mapH - height, Math.max(0, diagram.scrollTop / contentH * mapH));
      view.style.left = `${left}px`;
      view.style.top = `${top}px`;
      view.style.width = `${Math.max(10, width)}px`;
      view.style.height = `${Math.max(10, height)}px`;
    }

    function panFromMinimap(event) {
      const rect = document.getElementById("minimap").getBoundingClientRect();
      const x = (event.clientX - rect.left) / rect.width;
      const y = (event.clientY - rect.top) / rect.height;
      diagram.scrollLeft = x * stage.offsetWidth - diagram.clientWidth / 2;
      diagram.scrollTop = y * stage.offsetHeight - diagram.clientHeight / 2;
      updateMinimap();
    }

    function applyZoom() {
      const svgEl = stage.querySelector("svg");
      if (!svgEl || !svgEl.viewBox) return;
      const box = svgEl.viewBox.baseVal;
      svgEl.setAttribute("width", String(box.width));
      svgEl.setAttribute("height", String(box.height));
      svgEl.style.maxWidth = "none";
      svgEl.style.transformOrigin = "0 0";
      svgEl.style.transform = `scale(${scale})`;
      stage.style.width = `${box.width * scale}px`;
      stage.style.height = `${box.height * scale}px`;
      toolButton("out").disabled = scale <= MIN_SCALE + 0.001;
      toolButton("in").disabled = scale >= MAX_SCALE - 0.001;
      updateMinimap();
    }

    function centerRoot(name) {
      const rootNode = [...stage.querySelectorAll(".node")].find((node) => {
        return (node.querySelector(".nodeLabel") || node).textContent.trim() === name;
      });
      if (!rootNode) return;
      const diagramRect = diagram.getBoundingClientRect();
      const rootRect = rootNode.getBoundingClientRect();
      diagram.scrollLeft = rootRect.left - diagramRect.left + diagram.scrollLeft + rootRect.width / 2 - diagram.clientWidth / 2;
      diagram.scrollTop = Math.max(0, rootRect.top - diagramRect.top + diagram.scrollTop - 28);
    }

    function setScale(next, name) {
      const prev = scale;
      scale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, next));
      const cx = diagram.scrollLeft + diagram.clientWidth / 2;
      const cy = diagram.scrollTop + diagram.clientHeight / 2;
      applyZoom();
      const ratio = scale / prev;
      diagram.scrollLeft = cx * ratio - diagram.clientWidth / 2;
      diagram.scrollTop = cy * ratio - diagram.clientHeight / 2;
      if (name) centerRoot(name);
    }

    async function toggleFullscreen() {
      if (document.fullscreenElement || canvas.classList.contains("is-overlay")) {
        canvas.classList.remove("is-overlay");
        if (document.fullscreenElement) await document.exitFullscreen();
        return;
      }
      try {
        await canvas.requestFullscreen();
      } catch {
        canvas.classList.add("is-overlay");
      }
    }

    async function show(lang) {
      const view = localize(lang);
      document.documentElement.lang = HTML_LANG[lang];
      document.title = view.name;
      document.getElementById("name").textContent = view.name;
      document.getElementById("tamga").setAttribute("aria-label", TAMGA[lang]);
      document.querySelector("#tamga title").textContent = TAMGA[lang];
      document.getElementById("eleven").textContent = SUBTITLE[lang];
      document.getElementById("legend").setAttribute("aria-label", LEGEND[lang].label);
      document.getElementById("legend-solid").textContent = LEGEND[lang].solid;
      document.getElementById("legend-dotted").textContent = LEGEND[lang].dotted;
      document.getElementById("legend-names").textContent = LEGEND[lang].names;
      diagram.setAttribute("aria-label", SUBTITLE[lang]);
      updateToolLabels(lang);
      for (const button of document.querySelectorAll(".langs button")) {
        button.setAttribute("aria-pressed", String(button.dataset.lang === lang));
      }

      const seq = ++renderSeq;
      diagram.classList.add("is-swapping");
      error.hidden = true;
      try {
        configureMermaid();
        const { svg } = await mermaid.render("shezhire-" + seq, view.diagram);
        if (seq !== renderSeq) return;
        stage.innerHTML = svg;
        joinStems(stage.querySelector("svg"));
        applyZoom();
        if (document.getElementById("search").value.trim()) applySearch(true);
        else {
          centerRoot(view.name);
          mountMinimap();
        }
      } catch (err) {
        if (seq !== renderSeq) return;
        stage.textContent = "";
        error.hidden = false;
        error.textContent = String(err && err.message ? err.message : err);
      }
      if (seq === renderSeq) diagram.classList.remove("is-swapping");
    }

    const searchForm = document.getElementById("search-form");
    const searchInput = document.getElementById("search");
    searchForm.addEventListener("submit", (event) => event.preventDefault());
    searchInput.addEventListener("input", () => {
      hitIndex = 0;
      applySearch(true);
    });
    searchInput.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" || hits.length < 2) return;
      event.preventDefault();
      hitIndex = event.shiftKey ? (hitIndex - 1 + hits.length) % hits.length : (hitIndex + 1) % hits.length;
      applySearch(true);
    });

    document.querySelector(".langs").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-lang]");
      if (button) show(button.dataset.lang);
    });

    document.getElementById("themes").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-theme]");
      if (!button || button.getAttribute("aria-pressed") === "true") return;
      applyTheme(button.dataset.theme);
      show(pageLang());
    });

    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
      if (themeMode() === "system") show(pageLang());
    });

    document.getElementById("tools").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const lang = document.documentElement.lang === "en" ? "en" : document.documentElement.lang === "ru" ? "ru" : "kz";
      if (button.dataset.action === "in") setScale(scale * 1.25);
      if (button.dataset.action === "out") setScale(scale / 1.25);
      if (button.dataset.action === "reset") {
        setScale(1);
        const query = document.getElementById("search").value.trim();
        const hit = query && hits[hitIndex] && drawnNode(hits[hitIndex].id);
        if (hit) centerOnDrawn(hit);
        else centerRoot(document.getElementById("name").textContent);
      }
      if (button.dataset.action === "fullscreen") toggleFullscreen().then(() => updateToolLabels(lang));
    });

    document.addEventListener("fullscreenchange", () => {
      const lang = document.documentElement.lang === "en" ? "en" : document.documentElement.lang === "ru" ? "ru" : "kz";
      updateToolLabels(lang);
      updateMinimap();
    });

    diagram.addEventListener("scroll", updateMinimap, { passive: true });
    window.addEventListener("resize", updateMinimap);

    const minimap = document.getElementById("minimap");
    minimap.addEventListener("pointerdown", (event) => {
      minimap.setPointerCapture(event.pointerId);
      panFromMinimap(event);
    });
    minimap.addEventListener("pointermove", (event) => {
      if (minimap.hasPointerCapture(event.pointerId)) panFromMinimap(event);
    });

    show("kz");
  </script>
</body>
</html>
